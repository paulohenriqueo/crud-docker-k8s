spring.application.name=usuario-api

# ---- Banco ----------------------------------------------------------------
# Host, porta e banco vem de env var: no Compose o host e o nome do servico
# ("mysql"), no Kubernetes o nome do Service. Nada de localhost chumbado.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:crud}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
# Sem valor default de propósito: a aplicacao nao sobe sem a senha vir do
# ambiente (Secret no K8s). Senha nunca fica neste arquivo, que e versionado.
spring.datasource.password=${MYSQL_PASSWORD}

# O schema e responsabilidade do Flyway. "validate" faz a aplicacao falhar no
# boot se a tabela nao bater com a entidade, em vez de alterar o banco sozinha.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Flyway ---------------------------------------------------------------
spring.flyway.enabled=true
# Tolera o MySQL ainda nao estar pronto. O depends_on do Compose garante que o
# container iniciou, nao que o banco aceita conexao — sem retry, o backend
# morre no primeiro boot de um "compose up" limpo.
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5s

# ---- API ------------------------------------------------------------------
# Teto de itens por pagina: impede que um cliente peca a tabela inteira.
spring.data.web.pageable.max-page-size=100
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Actuator -------------------------------------------------------------
# Expoe /actuator/health/liveness e /actuator/health/readiness, que sao
# exatamente os endpoints das probes do Deployment na Semana 3.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
